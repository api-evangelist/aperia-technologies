aid: aperia-technologies
name: Aperia Technologies
description: 'Aperia Technologies is a Burlingame, California vehicle-technology company
  that builds active tire-inflation hardware and predictive tire-maintenance software
  for commercial fleets. Its Halo automatic tire inflator bolts on at the wheel end and
  uses wheel rotation to keep tires at their target pressure, while the Halo Connect
  platform pairs that hardware with machine-learning analytics trained on billions of
  real-world fleet miles to deliver tire health, leak detection, tread, load and
  vibration insight across steer, drive and trailer positions. Halo Connect exposes a
  partner REST API so fleet telematics, maintenance and TMS platforms can pull vehicle
  records, inflation issues and hardware issues out of the Halo Connect portal.'
