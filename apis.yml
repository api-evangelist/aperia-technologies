  x-evidence:
    fetched: '2026-08-06'
    api_reference:
      url: https://aperiatech.com/wp-content/uploads/2024/03/Halo-Connect-API-Documentation-v0.6.pdf
      http_status: 200
      note: '"Halo Connect API Documentation v0.6", revised 2021-04-16, (c) Aperia
        Technologies. Documents four GET operations against {host}: /api/partner/v1/issues,
        /api/partner/v1/vehicles, /api/partner/v1/hardwareissues and /api/v1/health.'
    base_url_probe:
      url: https://haloconnect.aperiatech.com/api/v1/health
      http_status: 200
      body: '{"status":"UP"}'
      note: Response matches the health example published in the PDF verbatim, which
        is what resolves the PDF's {host} placeholder to haloconnect.aperiatech.com.
    spec_note: >-
      No OpenAPI, Swagger, GraphQL, AsyncAPI or MCP document was found on any Aperia host.
      The published API reference is a PDF only. haloconnect.aperiatech.com answers every
      unrouted path with a 2,576-byte SPA shell (HTTP 200) — /openapi.json, /swagger.json,
      /v3/api-docs, /api-docs/swagger-config and every /.well-known/* path return that same
      shell, so none of them is a spec. Under /api/* the gateway returns a blanket
      401 {"errorType":"UNAUTHORIZED"} for real and non-existent paths alike (verified with
      the control path /api/partner/v1/zzznotreal), so /api/v3/api-docs cannot be read and
      individual documented operations cannot be confirmed anonymously. No OpenAPI has been
      generated from the PDF: the documented operations beyond /api/v1/health are unverifiable
      without partner credentials.
