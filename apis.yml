apis:
- aid: aperia-technologies:halo-connect-partner-api
  name: Halo Connect Partner API
  description: 'The Halo Connect Partner API is the read-only REST integration surface
    of the Halo Connect tire-management portal. Partners and fleet platforms authenticate
    with HTTP Basic credentials and pull vehicle records (VIN, vehicle type, fleet
    vehicle id, latest GPS geotag, last-data-received timestamp), tire inflation issues
    (severity, status, type such as UNDERINFLATION / OVERINFLATION / LEAK / BLOWOUT /
    MAINTENANCE, the sensor tyre position and the recommended remediation actions) and
    hardware issues for gateways, sensors and GPS units. Collections are paged with
    page/size and support conditional retrieval via If-Modified-Since.'
  humanURL: https://aperiatech.com/product/halo-connect/
  baseURL: https://haloconnect.aperiatech.com/api/partner/v1
